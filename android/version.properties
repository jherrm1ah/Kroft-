# The Android app's version. Raise VERSION_NAME (MAJOR.MINOR.PATCH) for every APK/AAB that changes
# the native app: new plugin, permission, icon, Android settings. Changes to the screens and
# features don't need one; they come from the website.
#
# versionCode is derived as MAJOR*10000 + MINOR*100 + PATCH (1.1.0 -> 10100), so it always goes
# up with the version. CI can override either with KROFT_VERSION_NAME / KROFT_VERSION_CODE.
# Builds made before this file existed report versionCode 1.
VERSION_NAME=1.2.0
