<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>KROFT</title>
<!-- Shown by the Android app (capacitor.config.json server.errorPath) when KROFT can't be reached,
     e.g. the very first launch with no connection, before the app has been cached on the phone. -->
<style>
  html, body { margin: 0; height: 100%; background: #f4f2ee; color: #0a0a0a; font-family: -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { min-height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px; box-sizing: border-box; text-align: center; }
  h1 { font-size: 22px; margin: 0 0 8px; letter-spacing: -0.3px; }
  p { font-size: 15.5px; line-height: 1.5; color: #6b6860; max-width: 320px; margin: 0 0 24px; }
  button { height: 52px; padding: 0 28px; border-radius: 999px; border: none; background: #4f5389; color: #fff; font-size: 16px; font-weight: 600; font-family: inherit; }
</style>
</head>
<body>
<main>
  <h1>You're offline</h1>
  <p>KROFT needs an internet connection to open the first time. Connect and try again.</p>
  <button type="button" onclick="location.href='https://kroft-pied.vercel.app/'">Try again</button>
</main>
</body>
</html>
