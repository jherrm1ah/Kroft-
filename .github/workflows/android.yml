name: Android APK

# Builds an installable debug APK of the KROFT Android app (Capacitor, see capacitor.config.json)
# on GitHub's Linux runner, which ships with the Android SDK. The APK is saved as a workflow
# artifact and also committed to the `android-apk` branch, so it can be downloaded directly.
#
# Debug builds are for installing on your own phone. They are signed with the fixed debug key in
# android/app/kroft-debug.keystore and must never be uploaded to the Play Store.
on:
  workflow_dispatch: {}
  pull_request:
    paths:
      - "android/**"
      - "capacitor.config.json"
      - "src/native.js"
      - "src/main.jsx"
      - "vite.config.js"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/android.yml"
  push:
    branches: [main]
    paths:
      - "android/**"
      - "capacitor.config.json"
      - "src/native.js"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/android.yml"

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write # to publish the APK to the android-apk branch

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      # The runner ships with the Android SDK and its command-line tools; just make sure the exact
      # platform and build tools this project compiles against are installed.
      - name: Android SDK packages
        run: |
          SDKM=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)
          echo "Using $SDKM"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" --install "platforms;android-36" "build-tools;36.0.0" "platform-tools" > /dev/null
          ls "$ANDROID_HOME/platforms" "$ANDROID_HOME/build-tools"

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build web app and copy it into the Android project
        run: |
          npm run build
          npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Verify the APK
        id: verify
        run: |
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          mkdir -p out
          cp "$APK" out/KROFT-debug.apk
          {
            echo "KROFT debug APK"
            echo "commit: ${GITHUB_SHA}"
            echo "built: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "size_bytes: $(stat -c %s out/KROFT-debug.apk)"
            echo "sha256: $(sha256sum out/KROFT-debug.apk | cut -d' ' -f1)"
            echo
            echo "== aapt2 dump badging =="
            "$BT/aapt2" dump badging out/KROFT-debug.apk | grep -E "^(package|sdkVersion|targetSdkVersion|application-label|uses-permission|launchable-activity)"
            echo
            echo "== apksigner verify =="
            "$BT/apksigner" verify --verbose --print-certs out/KROFT-debug.apk | grep -E "Verifies|Verified using|Signer #1 certificate (DN|SHA-256)"
          } | tee out/BUILD-INFO.txt
          grep -q "package: name='com.orynthra.kroft'" out/BUILD-INFO.txt
          grep -q "application-label:'KROFT'" out/BUILD-INFO.txt
          # The version numbers come from android/version.properties (MAJOR*10000+MINOR*100+PATCH).
          NAME=$(sed -n 's/^VERSION_NAME=//p' android/version.properties)
          IFS=. read -r MA MI PA <<< "$NAME"
          CODE=$((MA * 10000 + MI * 100 + PA))
          grep -q "versionCode='$CODE' versionName='$NAME'" out/BUILD-INFO.txt
          grep -q "^Verifies" out/BUILD-INFO.txt

      - uses: actions/upload-artifact@v4
        with:
          name: KROFT-debug-apk
          path: out/
          retention-days: 30

      - name: Publish to the android-apk branch
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        run: |
          cd out
          git init -q
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -q -b android-apk
          cat > README.md <<'EOF'
          # KROFT debug APK

          `KROFT-debug.apk` is the latest debug build of the KROFT Android app, built by
          `.github/workflows/android.yml`. Details (commit, SHA-256, permissions, signature) are in
          `BUILD-INFO.txt`. For installing on your own phone only; not for the Play Store.
          EOF
          git add -A
          git commit -q -m "KROFT debug APK from ${GITHUB_SHA::7}"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" android-apk
