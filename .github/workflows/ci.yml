name: CI

# Builds the app and runs the tests on every pull request and every push to main, so a change that
# breaks the build or the reply formatting is caught before Vercel deploys it.
on:
  pull_request:
  push:
    branches: [main]

# A newer push to the same branch makes the older run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

  # The real build, run as the website and as older and current copies of the Android app
  # (tests/e2e/native-shells.mjs). Stands in for a staging environment: a change that breaks
  # any of them can't be merged unnoticed.
  app-shells:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Install the test browser
        run: npx playwright install --with-deps chromium

      - name: Website and Android app shells
        run: npm run test:e2e
