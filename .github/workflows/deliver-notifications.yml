name: Deliver scheduled push notifications

# Vercel's own Cron Jobs are limited to once a day on the Hobby plan (see vercel.json's `crons`
# entry, kept as a free daily safety net) — nowhere near frequent enough to deliver an appointment
# reminder anywhere near its real time. This workflow is the actual delivery trigger: it just
# calls the same /api/cron/deliver-notifications endpoint on a schedule GitHub Actions can run for
# free, independent of Vercel's plan tier. The endpoint is idempotent (it only ever sends a row
# once and marks it sent), so this and the Vercel Cron entry can never double-deliver the same
# notification.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

jobs:
  deliver:
    runs-on: ubuntu-latest
    steps:
      - name: Call deliver-notifications endpoint
        run: |
          status=$(curl -sS -o /tmp/response.json -w "%{http_code}" \
            -X POST "https://kroft-pied.vercel.app/api/cron/deliver-notifications" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}")
          echo "HTTP status: $status"
          cat /tmp/response.json
          if [ "$status" -ge 400 ]; then
            echo "Delivery endpoint returned an error status"
            exit 1
          fi
