<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>KROFT</title>
    <meta name="description" content="Your money, schedule, contacts, notes and wellbeing in one assistant. By Orynthra." />

    <!-- Link previews (WhatsApp, iMessage, X, LinkedIn, Slack...). Absolute URLs are required here;
         update the address if KROFT moves to its own domain. -->
    <link rel="canonical" href="https://kroft-pied.vercel.app/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="KROFT" />
    <meta property="og:title" content="KROFT, your personal assistant" />
    <meta property="og:description" content="Your money, schedule, contacts, notes and wellbeing in one assistant. By Orynthra." />
    <meta property="og:url" content="https://kroft-pied.vercel.app/" />
    <meta property="og:image" content="https://kroft-pied.vercel.app/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="KROFT by Orynthra: your money, schedule, contacts and wellbeing, in one assistant." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="KROFT, your personal assistant" />
    <meta name="twitter:description" content="Your money, schedule, contacts, notes and wellbeing in one assistant. By Orynthra." />
    <meta name="twitter:image" content="https://kroft-pied.vercel.app/og-image.png" />

    <!-- Inter, the app's typeface (APP_FONT). A single variable-weight file covers every weight
         used (400 to 900), and linking it here starts the download alongside the page rather than
         after the app's script has loaded and run. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400..900&display=swap" />
    <link rel="preload" as="image" href="/onboarding-screen-1.webp" type="image/webp" />

    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/icons/icon-192.png" type="image/png" sizes="192x192" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- Browser bar colour. The app keeps it in step with its own light/dark setting. -->
    <meta name="theme-color" content="#f4f2ee" />

    <!-- iPhone and iPad: icon, name and full-screen launch when added to the home screen. -->
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="KROFT" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <style>
      html, body { margin: 0; background: #f4f2ee; }
      /* The splash, drawn straight from this HTML so the brand shows the moment the page arrives
         instead of a blank screen while the app's script downloads. It is identical to
         SplashScreen in src/Kroft.jsx (same image, same frame), so React taking over is seamless. */
      .boot-splash { position: fixed; inset: 0; background: #f4f2ee; display: flex; align-items: center; justify-content: center; }
      .boot-splash > div { position: relative; width: 100%; height: 100%; max-width: calc(100vh * 531 / 949); max-height: calc(100vw * 949 / 531); }
      .boot-splash img { width: 100%; height: 100%; display: block; }
    </style>
  </head>
  <body>
    <div id="root"><div class="boot-splash" aria-hidden="true"><div><img src="/onboarding-screen-1.webp" alt="" /></div></div></div>
    <noscript style="position:fixed;bottom:24px;left:0;right:0;text-align:center;font:15px/1.5 sans-serif;color:#3a3833">KROFT needs JavaScript turned on to run.</noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
